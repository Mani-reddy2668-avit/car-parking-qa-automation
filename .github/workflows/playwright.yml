name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        USER_A_EMAIL: ${{ secrets.USER_A_EMAIL }}
        USER_A_PASSWORD: ${{ secrets.USER_A_PASSWORD }}
        USER_B_EMAIL: ${{ secrets.USER_B_EMAIL }}
        USER_B_PASSWORD: ${{ secrets.USER_B_PASSWORD }}
        USER_C_EMAIL: ${{ secrets.USER_C_EMAIL }}
        USER_C_PASSWORD: ${{ secrets.USER_C_PASSWORD }}

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
